[project]
name = "fitatu-cli"
version = "0.1.0"
description = "Read your Fitatu food diary from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fitatu = "fitatu_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.14"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "typos>=1.51.1",
    "vulture>=2.16",
    "zizmor>=1.30.1",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PIE", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S107"]

[tool.pytest.ini_options]
addopts = "--cov --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
# Fixtures used only through @pytest.mark.usefixtures or autouse.
ignore_names = ["read_command", "fixed_clock_and_node", "fixed_clock"]

[tool.mutmut]
source_paths = ["src/"]
# The coverage gate measures the mutated copy in mutants/, not src/.
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.typos.default.extend-words]
# Deliberate misspelling in the unknown-command test.
statu = "statu"
